[package]
name = "cedar-ffi-test"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "cedar_ffi"
crate-type = ["staticlib", "rlib"]
doctest = false

[dependencies]
cedar-policy = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# Enables the Cedar official DRT conformance corpus runner
# (tests/conformance_test.rs). Off by default so `cargo test` stays fast.
# Adds no extra crates: the runner reads an already-extracted corpus directory
# with std::fs only (the Taskfile fetches and unpacks the tarball).
conformance = []

[build-dependencies]
cc = "1"
pkg-config = "0.3"
